{% extends 'predictor/admin_base.html' %}
{% block title %}Analytics{% endblock %}
{% block content %}
<div class="glass-card p-4">
    <h4 class="mb-4"><i class="bi bi-graph-up me-2"></i>Analytics Dashboard</h4>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-card p-3"><h6>Predictions by Location</h6><canvas id="analyticsPie" height="200"></canvas></div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-3"><h6>Monthly Predictions</h6><canvas id="analyticsLine" height="200"></canvas></div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-3"><h6>User Growth</h6><canvas id="userGrowth" height="200"></canvas></div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-3"><h6>Avg House Price by Location</h6><canvas id="avgPrice" height="200"></canvas></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Placeholder data – replace with real data from backend later
    new Chart(document.getElementById('analyticsPie'), {
        type: 'pie',
        data: {
            labels: ['Suburb','Urban','Rural'],
            datasets: [{ data: [40,35,25], backgroundColor: ['#4F46E5','#7C3AED','#06B6D4'] }]
        }
    });
    new Chart(document.getElementById('analyticsLine'), {
        type: 'line',
        data: {
            labels: ['Jan','Feb','Mar'],
            datasets: [{ label:'Predictions', data:[10,20,15], borderColor: '#7C3AED' }]
        }
    });
    new Chart(document.getElementById('userGrowth'), {
        type: 'bar',
        data: {
            labels: ['Jan','Feb','Mar'],
            datasets: [{ label:'New Users', data:[5,8,12], backgroundColor: '#4F46E5' }]
        }
    });
    new Chart(document.getElementById('avgPrice'), {
        type: 'bar',
        data: {
            labels: ['Suburb','Urban','Rural'],
            datasets: [{ label:'$', data:[300000,500000,200000], backgroundColor: '#06B6D4' }]
        }
    });
</script>
{% endblock %}
