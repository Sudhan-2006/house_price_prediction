{% if items.has_other_pages %}
<nav>
    <ul class="pagination">
        {% if items.has_previous %}
        <li class="page-item"><a class="page-link" href="?page=1{% if search_query %}&q={{ search_query }}{% endif %}">&laquo;</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ items.previous_page_number }}{% if search_query %}&q={{ search_query }}{% endif %}">prev</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Page {{ items.number }} of {{ items.paginator.num_pages }}</span></li>
        {% if items.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ items.next_page_number }}{% if search_query %}&q={{ search_query }}{% endif %}">next</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ items.paginator.num_pages }}{% if search_query %}&q={{ search_query }}{% endif %}">&raquo;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
