<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-layout d-flex">
    <!-- Professional Dark Sidebar -->
    <aside class="admin-sidebar d-flex flex-column">
        <div class="sidebar-brand px-4 py-3">
            <a href="{% url 'admin_dashboard' %}" class="text-white text-decoration-none d-flex align-items-center">
                <i class="bi bi-house-check-fill fs-4 me-2"></i>
                <span class="fw-bold fs-5">HPP Admin</span>
            </a>
        </div>
        <hr class="text-white-50 mx-3 my-2">
        <nav class="nav flex-column flex-grow-1 px-3">
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}" href="{% url 'admin_users' %}">
                <i class="bi bi-people me-2"></i> Users
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_predictions' %}active{% endif %}" href="{% url 'admin_predictions' %}">
                <i class="bi bi-house me-2"></i> Predictions
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_analytics' %}active{% endif %}" href="{% url 'admin_analytics' %}">
                <i class="bi bi-graph-up me-2"></i> Analytics
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_models' %}active{% endif %}" href="{% url 'admin_models' %}">
                <i class="bi bi-cpu me-2"></i> Models
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_dataset' %}active{% endif %}" href="{% url 'admin_dataset' %}">
                <i class="bi bi-database me-2"></i> Dataset
            </a>
            <a class="nav-link text-white-50 {% if request.resolver_match.url_name == 'admin_reports' %}active{% endif %}" href="{% url 'admin_reports' %}">
                <i class="bi bi-file-earmark-text me-2"></i> Reports
            </a>
        </nav>
        <div class="mt-auto px-3 pb-3">
            <a class="nav-link text-white-50" href="{% url 'dashboard_redirect' %}">
                <i class="bi bi-arrow-left me-2"></i> User Dashboard
            </a>
            <a class="nav-link text-danger" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content flex-grow-1 d-flex flex-column">
        <!-- Top Header Bar -->
        <header class="top-header bg-white shadow-sm px-4 py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark">{% block page_title %}Admin Dashboard{% endblock %}</h5>
            <div class="d-flex align-items-center">
                <span class="text-muted me-3"><i class="bi bi-person-circle me-1"></i> {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </header>
        <!-- Page Content -->
        <div class="p-4 flex-grow-1">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
