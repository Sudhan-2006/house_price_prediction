{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100">
        <div class="col-md-5" data-aos="fade-up">
            <div class="glass-card p-5 shadow-lg border-0 rounded-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome back</h2>
                    <p class="text-muted">Login to your account</p>
                </div>
                {% if form.errors %}
                    <div class="alert alert-danger">Invalid username or password.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Login</button>
                </form>
                <p class="text-center mt-3">Don't have an account? <a href="{% url 'signup' %}" class="text-accent">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
